# PostgreSQL 16 with pgvector (and btree_gist, which ships with Postgres).
#   docker compose up -d
# Host port 5433 is used so it never clashes with a locally installed Postgres on 5432.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: skillswap-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillswap}
      POSTGRES_DB: ${POSTGRES_DB:-skillswap_campus}
      TZ: Asia/Kolkata
    ports:
      - "5433:5432"
    volumes:
      - skillswap_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillswap}"]
      interval: 3s
      retries: 20
volumes:
  skillswap_pg: {}
